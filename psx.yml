version: 1

project:
  type: "lua-plugin-extension"
  name: "cdin-x"
  description: "Extension system for cdin text editor (C + Lua)"

rules:
  # ── Documentation ──────────────────────────────
  readme: error
  license: error
  changelog: info
  contributing: error
  api_docs: warning
  security: info
  code_of_conduct: info
  pull_request_template: error
  issue_templates: error
  docs_folder: info

  # ── Quality ────────────────────────────────────
  pre_commit: error
  editorconfig: error
  code_owners: info
  lint: error
  tests_folder: warning

  # ── DevOps ─────────────────────────────────────
  dockerfile: warning
  dockerignore: info
  github_workflows: error
  ci_cd: error
  dependabot: info
  pre_commit_hooks: info

  # ── Plugin-specific ────────────────────────────
  plugin_init: error
  plugin_manifest: error
  plugin_readme: error
  plugin_test: warning

  # ── Structure ──────────────────────────────────
  # `X_folder`, `core_folder` and `integration_folder` are deliberately absent.
  # They asserted a layout this repository no longer has: a top-level `core/`,
  # an `X/integration/`, and `X/themes/`. What replaced them is below, and the
  # rules that matter are enforced by `make validate` rather than by a checker
  # that only knows where a file is:
  #
  #   * a package's identity is `name` in its package.lua, never its path
  #   * nothing is mandatory; a bundle decides what a build ships
  #   * a seam between two packages is a `with` entry, not a third package
  #
  # See AGENTS.md and CODE_STYLE.md for those, and X/README.md for what is left
  # under X/.
  packages_folder: error
  scripts_folder: info
  examples_folder: info
  issue_templates: error
  pr_template: error

custom:
  folders:
    # The kernel. Everything under here is cdin-x itself: it reads the host
    # through host.lua and knows nothing about any package.
    - path: "cdinx"
      structure:
        init: {}
        config: {}
        host: {}
        manifest: {}
        schema: {}
        command: {}

    # X/ — what has not moved into packages/ yet. It is `vim`, and it is the
    # last entry.
    - path: "X"
      structure:
        core: {}
        syntax: {}
        optional: {}

    # Packages, grouped by domain. The domain is for humans; identity is the
    # package's own name.
    - path: "packages"
      structure: {}

    # Bundles — what a build ships. `standard` is the default; `make bundle
    # BUNDLE=minimal` builds the kernel alone.
    - path: "bundles"
      structure: {}

    # Documentation
    - path: "docs"
      structure:
        building: {}
        plugins: {}
        README: {}

    # Scripts — the dev tooling. Every target in the Makefile lands here.
    - path: "scripts"
      structure:
        validate: {}
        check: {}
        bundle: {}
        plugin-list: {}
        generate-manifest: {}
        generate-index: {}
        install: {}
        new-plugin: {}
        README: {}

  files:
    # Root project files
    - path: "/psx.yml"
    - path: "/.psx-project.yml"
    - path: "/README.md"
    - path: "/CHANGELOG.md"
    - path: "/LICENSE"
    - path: "/Makefile"
    - path: "/CONTRIBUTING.md"
    - path: "/CODE_OF_CONDUCT.md"
    - path: "/CODEOWNERS"
    - path: "/SECURITY.md"
    - path: "/AGENTS.md"
    - path: "/CODE_STYLE.md"
    - path: "/NOTICE"
    - path: "/.gitignore"
    - path: "/.dockerignore"
    - path: "/.editorconfig"
    - path: "/.luacheckrc"
    - path: "/.luarc.json"
    - path: "/stylua.toml"
    - path: "/.pre-commit-config.yaml"

    # cdinx/ — the kernel
    - path: "/cdinx/init.lua"
    - path: "/cdinx/config.lua"
    - path: "/cdinx/host.lua"
    - path: "/cdinx/manifest.lua"
    - path: "/cdinx/schema.lua"
    - path: "/cdinx/command.lua"
    - path: "/cdinx/manager/loader.lua"
    - path: "/cdinx/manager/runtime.lua"
    - path: "/cdinx/manager/catalog.lua"
    - path: "/cdinx/manager/features.lua"
    - path: "/cdinx/manager/with.lua"
    - path: "/cdinx/manager/deps.lua"
    - path: "/cdinx/manager/fetch.lua"
    - path: "/cdinx/manager/lifecycle.lua"
    - path: "/cdinx/panel/init.lua"

    # plugins/ — the kernel's entry point in a build, and the shim every bundle
    # writes alongside the kernel itself.
    - path: "/plugins/cdin-x/init.lua"

    # bundles/ — what a build ships
    - path: "/bundles/standard.lua"
    - path: "/bundles/minimal.lua"
    - path: "/bundles/empty.lua"

    # packages/ — one manifest each, which is what makes a package a package.
    # `X/` was in this list until Phase 9 and no longer is; `registry/generated/`
    # was never here, because the index is generated and a packaging list that
    # names it is a packaging list that can be stale.
    - path: "/packages/navigation/workspace/package.lua"
    - path: "/packages/navigation/launcher/package.lua"
    - path: "/packages/system/themes/package.lua"
    - path: "/packages/vcs/git/package.lua"

    # packages/languages/ — a package like any other, with the definition in its
    # own file so `init.lua` is the same three lines in all six.
    - path: "/packages/languages/c/package.lua"
    - path: "/packages/languages/c/syntax.lua"
    - path: "/packages/languages/c/init.lua"
    - path: "/packages/languages/javascript/package.lua"
    - path: "/packages/languages/javascript/syntax.lua"
    - path: "/packages/languages/javascript/init.lua"
    - path: "/packages/languages/lua/package.lua"
    - path: "/packages/languages/lua/syntax.lua"
    - path: "/packages/languages/lua/init.lua"
    - path: "/packages/languages/markdown/package.lua"
    - path: "/packages/languages/markdown/syntax.lua"
    - path: "/packages/languages/markdown/init.lua"
    - path: "/packages/languages/python/package.lua"
    - path: "/packages/languages/python/syntax.lua"
    - path: "/packages/languages/python/init.lua"
    - path: "/packages/languages/typescript/package.lua"
    - path: "/packages/languages/typescript/syntax.lua"
    - path: "/packages/languages/typescript/init.lua"

    # Examples
    - path: "/examples/01-hello/init.lua"
    - path: "/examples/02-word-count/init.lua"
    - path: "/examples/03-vim-word-count/init.lua"

    # Documentation
    - path: "/docs/README.md"
    - path: "/docs/getting-started.md"
    - path: "/docs/writing-a-plugin.md"
    - path: "/docs/extending-vim.md"
    - path: "/docs/installing-plugins.md"

    # Scripts
    - path: "/scripts/validate.lua"
    - path: "/scripts/check.lua"
    - path: "/scripts/bundle.py"
    - path: "/scripts/install.py"
    - path: "/scripts/plugin-list.lua"
    - path: "/scripts/generate-manifest.lua"
    - path: "/scripts/generate-index.lua"
    - path: "/scripts/new-plugin.lua"
    - path: "/scripts/README.md"

    # Git hooks
    - path: "/.husky/pre-commit"
    - path: "/.husky/commit-msg"
    - path: "/.husky/pre-push"

    # GitHub templates & workflows
    - path: "/.github/PULL_REQUEST_TEMPLATE.md"
    - path: "/.github/dependabot.yml"
    - path: "/.github/ISSUE_TEMPLATE/bug_report.yml"
    - path: "/.github/ISSUE_TEMPLATE/feature_request.yml"
    - path: "/.github/ISSUE_TEMPLATE/config.yml"
    - path: "/.github/workflows/ci.yml"
    - path: "/.github/workflows/bundle.yml"
    - path: "/.github/workflows/contract.yml"
    - path: "/.github/workflows/release.yml"
    - path: "/.github/workflows/tag.yml"
    - path: "/.github/workflows/test-install.yml"